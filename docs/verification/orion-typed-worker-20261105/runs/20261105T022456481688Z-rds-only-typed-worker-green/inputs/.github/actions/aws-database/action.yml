name: Configure StatArena AWS database
description: Load scoped RDS credentials and the regional trust bundle for this job.
inputs:
  mode:
    description: "typed-ingest for typed RDS ingestion, ingest for temporary legacy staging, runtime for read-only monitoring"
    required: true
  role-arn:
    description: AWS IAM role trusted for this workflow and ref
    required: true
runs:
  using: composite
  steps:
    - name: Require an AWS role for this repository
      shell: bash
      env:
        ROLE_ARN: ${{ inputs.role-arn }}
      run: |
        if [[ ! "$ROLE_ARN" =~ ^arn:aws:iam::361769570630:role/[A-Za-z0-9_+=,.@/-]+$ ]]; then
          echo 'Set the scoped StatArena AWS role repository variable.' >&2
          exit 1
        fi
    - name: Exchange GitHub OIDC token for a scoped AWS session
      uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: us-east-2
        allowed-account-ids: '361769570630'
        role-session-name: statarena-gh-${{ github.run_id }}-${{ github.run_attempt }}
        unset-current-credentials: true
        role-duration-seconds: 21600
    - name: Permit this hosted runner to reach RDS
      if: runner.environment == 'github-hosted'
      uses: ./.github/actions/aws-database/runner-ingress
    - name: Set verified RDS connection
      shell: bash
      env:
        ACCESS_MODE: ${{ inputs.mode }}
      run: python3 "$GITHUB_ACTION_PATH/bootstrap.py" "$ACCESS_MODE"
