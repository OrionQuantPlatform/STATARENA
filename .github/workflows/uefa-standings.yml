name: UEFA historical standings
on:
  push:
    paths:
      - '.github/workflows/uefa-standings.yml'
      - 'dashboard/frontend/src/services/uefa-standings.js'
      - 'dashboard/frontend/src/services/standings-clubs.js'
      - 'dashboard/frontend/src/components/CompetitionStandings.jsx'
      - 'dashboard/scripts/neon_refresh_uefa_standings.mjs'
      - 'tests/competition-render.test.mjs'
      - 'tests/standings-clubs.test.mjs'
      - 'tests/uefa-standings.test.mjs'
  schedule:
    - cron: '25 5 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        working-directory: dashboard
      - run: node --test tests/uefa-standings.test.mjs tests/standings-clubs.test.mjs tests/competition-render.test.mjs
      - run: node dashboard/scripts/neon_refresh_uefa_standings.mjs --check-source
  refresh:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_INGEST_DATABASE_URL }}
      NEON_STORAGE_ENDPOINT: ${{ secrets.NEON_STORAGE_ENDPOINT }}
      NEON_STORAGE_BUCKET: ${{ vars.STATARENA_STORAGE_BUCKET || 'statarena-data' }}
      NEON_STORAGE_REGION: ${{ vars.STATARENA_STORAGE_REGION || 'us-east-2' }}
      NEON_STORAGE_ACCESS_KEY_ID: ${{ secrets.NEON_INGEST_STORAGE_ACCESS_KEY_ID }}
      NEON_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.NEON_INGEST_STORAGE_SECRET_ACCESS_KEY }}
      STATARENA_EXTERNAL_STORAGE: ${{ vars.STATARENA_EXTERNAL_STORAGE }}
      STATARENA_S3_PATH_STYLE: ${{ vars.STATARENA_S3_PATH_STYLE || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dashboard
          filter: blob:none
      - name: Trust the AWS RDS certificate
        if: vars.STATARENA_EXTERNAL_STORAGE == '1'
        run: echo "NODE_EXTRA_CA_CERTS=$GITHUB_WORKSPACE/dashboard/backend/certs/rds-us-east-2.pem" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        working-directory: dashboard
      - run: node dashboard/scripts/neon_refresh_uefa_standings.mjs
