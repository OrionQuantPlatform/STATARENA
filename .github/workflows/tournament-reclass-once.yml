name: Reclassify World Cup seasons (AWS)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tournament-reclass-once.yml'
permissions:
  contents: read
concurrency:
  group: statarena-aws-ingestion
  cancel-in-progress: false
  queue: max
jobs:
  repair:
    if: github.repository_id == '1441213700' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.STATARENA_AWS_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            dashboard
            tests/test_football_seasons.py
            tests/test_tournament_publisher_aliases.py
            .github/actions/aws-database
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r dashboard/scripts/requirements.txt
      - name: Load verified AWS ingestion role
        uses: ./.github/actions/aws-database
        with:
          mode: ingest
          role-arn: ${{ vars.STATARENA_AWS_INGEST_ROLE_ARN }}
      - name: Validate normalization and inspect old seasons without writes
        shell: bash
        run: |
          set -euo pipefail
          # relational_materialize.py is the normal publisher; this workflow is a one-time repair.
          python -m unittest discover -s tests -p 'test_football_seasons.py' -q
          python -m unittest discover -s tests -p 'test_tournament_publisher_aliases.py' -q
          python dashboard/scripts/apply_tournament_reclass_once.py --snapshot statarena-before-season-reclass-20261106
      - name: Save reclassification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-cup-reclass-${{ github.run_id }}
          path: tournament-reclass-receipt.json
          if-no-files-found: ignore
          retention-days: 30
