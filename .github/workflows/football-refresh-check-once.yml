name: Verify football refresh
on:
  push:
    branches: ["codex/football-refresh-20261103"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r dashboard/scripts/neon-requirements.txt
      - name: Verify a goal refresh against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
        run: python tests/daily_refresh_postgres.py
      - name: Verify worker and source handling
        run: |
          python -m unittest discover -s tests -p 'test_daily_refresh.py' -v
          python -m unittest discover -s tests -p 'test_honours_worker.py' -v
          python -m unittest discover -s tests -p 'test_mls_fixture_alias.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        working-directory: dashboard
      - name: Verify portraits and honours
        env:
          BUN_BINARY: bun
        run: node --test tests/player-honours.test.mjs tests/player-identity.test.mjs tests/season_player_render.test.mjs
