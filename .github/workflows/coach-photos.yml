name: Restore coach portraits
on:
  push:
    branches: [main]
    paths: [".github/workflows/coach-photos.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: statarena-neon-ingestion
  cancel-in-progress: false
jobs:
  portraits:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_INGEST_DATABASE_URL }}
      NEON_STORAGE_ENDPOINT: ${{ secrets.NEON_STORAGE_ENDPOINT }}
      NEON_STORAGE_BUCKET: statarena-data
      NEON_STORAGE_REGION: us-east-2
      NEON_STORAGE_ACCESS_KEY_ID: ${{ secrets.NEON_INGEST_STORAGE_ACCESS_KEY_ID }}
      NEON_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.NEON_INGEST_STORAGE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dashboard
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: dashboard/scripts/neon-requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: pip install -r dashboard/scripts/neon-requirements.txt
      - run: bun install --frozen-lockfile
        working-directory: dashboard
      - name: Refresh priority club portraits
        run: node dashboard/scripts/neon_coach_photos.mjs --priority-only
      - name: Store priority portraits
        run: python dashboard/scripts/neon_assets.py --limit 3000 --retry-commons
      - name: Refresh remaining coach portraits
        run: node dashboard/scripts/neon_coach_photos.mjs --remaining-only
      - name: Store remaining portraits
        run: python dashboard/scripts/neon_assets.py --limit 3000 --retry-commons
