name: Cup data refresh

on:
  schedule:
    - cron: "17 */4 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cup-data.yml"
      - "dashboard/scripts/cup-worker.mjs"
      - "dashboard/shared/cup-worker.js"
      - "dashboard/frontend/app/api/open-cups/**"
      - "dashboard/frontend/app/api/openligadb/**"
      - "dashboard/frontend/app/api/nations-results/**"
      - "dashboard/frontend/app/api/standings/**"
      - "dashboard/frontend/src/services/cup-archives.js"
      - "dashboard/frontend/src/services/cup-catalog.js"
      - "dashboard/frontend/src/services/openfootball-cups.js"
      - "dashboard/frontend/src/services/openfootball-france-cup.js"
      - "dashboard/frontend/src/services/openligadb.js"
      - "dashboard/frontend/src/services/nations-results.js"
      - "dashboard/frontend/src/services/sportscore-standings.js"

permissions:
  contents: write

concurrency:
  group: football-cup-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Refresh cup fixtures and results
        run: node dashboard/scripts/cup-worker.mjs --data-root data --receipt "$RUNNER_TEMP/cup-receipt.json"
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
      - name: Publish changed snapshots
        id: publish
        run: |
          set -euo pipefail
          git add -f data/raw/cup-worker
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base=$(git rev-parse HEAD)
          git commit -m "[UPD] Refresh cup fixtures and results"
          for attempt in 1 2 3 4 5; do
            git fetch --depth=1 origin main
            target=$(git rev-parse FETCH_HEAD)
            if [ "$target" != "$base" ]; then
              git rebase --onto "$target" "$base" HEAD || { git rebase --abort; exit 1; }
              base="$target"
            fi
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "Could not publish after concurrent updates" >&2
          exit 1
      - name: Save collection receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cup-data-receipt
          path: ${{ runner.temp }}/cup-receipt.json
          if-no-files-found: ignore
          retention-days: 14
