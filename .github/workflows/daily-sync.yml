name: Daily Sync
on:
  schedule:
    - cron: "35 22 * * *"
    - cron: "10 6 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: Maximum collection minutes
        default: "60"
        required: true
      max_requests:
        description: Maximum provider requests
        default: "20000"
        required: true
permissions:
  contents: read
concurrency:
  group: statarena-neon-ingestion
  cancel-in-progress: false
  queue: max
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_INGEST_DATABASE_URL }}
      NEON_STORAGE_ENDPOINT: ${{ secrets.NEON_STORAGE_ENDPOINT }}
      NEON_STORAGE_BUCKET: ${{ vars.STATARENA_STORAGE_BUCKET || 'statarena-data' }}
      NEON_STORAGE_REGION: ${{ vars.STATARENA_STORAGE_REGION || 'us-east-2' }}
      NEON_STORAGE_ACCESS_KEY_ID: ${{ secrets.NEON_INGEST_STORAGE_ACCESS_KEY_ID }}
      NEON_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.NEON_INGEST_STORAGE_SECRET_ACCESS_KEY }}
      STATARENA_EXTERNAL_STORAGE: ${{ vars.STATARENA_EXTERNAL_STORAGE }}
      STATARENA_SQL_DOCUMENTS: ${{ vars.STATARENA_SQL_DOCUMENTS }}
      STATARENA_S3_PATH_STYLE: ${{ vars.STATARENA_S3_PATH_STYLE || '1' }}
      STATARENA_OBJECT_LIMIT_BYTES: ${{ vars.STATARENA_OBJECT_LIMIT_BYTES }}
      STATARENA_SQL_LIMIT_BYTES: ${{ vars.STATARENA_SQL_LIMIT_BYTES }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dashboard
          filter: blob:none
      - name: Trust the AWS RDS certificate
        if: vars.STATARENA_EXTERNAL_STORAGE == '1'
        run: |
          echo "PGSSLROOTCERT=$GITHUB_WORKSPACE/dashboard/backend/certs/rds-us-east-2.pem" >> "$GITHUB_ENV"
          echo "NODE_EXTRA_CA_CERTS=$GITHUB_WORKSPACE/dashboard/backend/certs/rds-us-east-2.pem" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: dashboard/scripts/neon-requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: pip install -r dashboard/scripts/neon-requirements.txt
      - run: bun install --frozen-lockfile
        working-directory: dashboard
      - name: Sync current matches directly into Neon
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
          SYNC_MODE: ${{ github.event_name == 'schedule' && github.event.schedule == '10 6 * * *' && 'pulse' || 'daily' }}
          SYNC_MINUTES: ${{ github.event_name == 'schedule' && github.event.schedule == '10 6 * * *' && '25' || inputs.minutes || '60' }}
          SYNC_REQUESTS: ${{ inputs.max_requests || '20000' }}
        run: python dashboard/scripts/neon_ingest.py --mode "$SYNC_MODE" --minutes "$SYNC_MINUTES" --max-requests "$SYNC_REQUESTS"
      - name: Refresh supplemental records in Neon
        if: github.event_name != 'schedule' || github.event.schedule != '10 6 * * *'
        run: node dashboard/scripts/neon_refresh_sources.mjs
      - name: Refresh player honours in Neon
        if: github.event_name != 'schedule' || github.event.schedule != '10 6 * * *'
        run: python dashboard/scripts/player_honours.py --limit 100
      - name: Refresh portraits for observed coaches
        if: github.event_name != 'schedule' || github.event.schedule != '10 6 * * *'
        run: node dashboard/scripts/neon_observed_coaches.mjs
      - name: Store new display images in Neon
        env:
          ASSET_LIMIT: ${{ github.event_name == 'schedule' && github.event.schedule == '10 6 * * *' && '1000' || '3000' }}
        run: python dashboard/scripts/neon_assets.py --limit "$ASSET_LIMIT"
