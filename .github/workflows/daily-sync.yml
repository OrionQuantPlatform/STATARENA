name: Daily Sync
on:
  schedule:
    - cron: "35 22 * * *"
    - cron: "10 6 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: Maximum collection minutes
        default: "60"
        required: true
      max_requests:
        description: Maximum provider requests
        default: "20000"
        required: true
permissions:
  contents: read
concurrency:
  group: statarena-aws-ingestion
  cancel-in-progress: false
  queue: max
jobs:
  sync:
    if: github.repository == 'OrionQuantPlatform/STATARENA' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/aws-backend-20261104')
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ vars.STATARENA_AWS_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    env:
      STATARENA_OBJECT_LIMIT_BYTES: ${{ vars.STATARENA_OBJECT_LIMIT_BYTES }}
      STATARENA_SQL_LIMIT_BYTES: ${{ vars.STATARENA_SQL_LIMIT_BYTES }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            dashboard
            .github/actions/aws-database
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: dashboard/scripts/neon-requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: pip install -r dashboard/scripts/neon-requirements.txt
      - run: bun install --frozen-lockfile
        working-directory: dashboard
      - name: Load AWS staging credentials
        uses: ./.github/actions/aws-database
        with:
          mode: ingest
          role-arn: ${{ vars.STATARENA_AWS_INGEST_ROLE_ARN }}
      - name: Stage current matches in AWS
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
          SYNC_MODE: ${{ github.event_name == 'schedule' && github.event.schedule == '10 6 * * *' && 'pulse' || 'daily' }}
          SYNC_MINUTES: ${{ github.event_name == 'schedule' && github.event.schedule == '10 6 * * *' && '25' || inputs.minutes || '60' }}
          SYNC_REQUESTS: ${{ inputs.max_requests || '20000' }}
        run: python dashboard/scripts/neon_ingest.py --skip-materialize --mode "$SYNC_MODE" --minutes "$SYNC_MINUTES" --max-requests "$SYNC_REQUESTS"
      - name: Refresh supplemental records in AWS staging
        if: github.event_name != 'schedule' || github.event.schedule != '10 6 * * *'
        run: node dashboard/scripts/neon_refresh_sources.mjs
      - name: Refresh player honours in AWS staging
        if: github.event_name != 'schedule' || github.event.schedule != '10 6 * * *'
        run: python dashboard/scripts/player_honours.py --limit 100
      - name: Refresh portraits for observed coaches
        if: github.event_name != 'schedule' || github.event.schedule != '10 6 * * *'
        run: node dashboard/scripts/neon_observed_coaches.mjs
      - name: Store new display images in AWS staging
        env:
          ASSET_LIMIT: ${{ github.event_name == 'schedule' && github.event.schedule == '10 6 * * *' && '1000' || '3000' }}
        run: python dashboard/scripts/neon_assets.py --limit "$ASSET_LIMIT"
      - name: Publish normalized RDS tables from staged data
        run: python dashboard/scripts/relational_materialize.py --minutes 15 --batch 10
