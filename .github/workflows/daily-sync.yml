name: Daily Sync
on:
  push:
    branches: [main]
    paths: [".github/workflows/daily-sync.yml"]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: Maximum collection minutes
        default: "60"
        required: true
      max_requests:
        description: Maximum provider requests
        default: "20000"
        required: true
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'push' && 'statarena-coach-portraits' || 'statarena-neon-ingestion' }}
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_INGEST_DATABASE_URL }}
      NEON_STORAGE_ENDPOINT: ${{ secrets.NEON_STORAGE_ENDPOINT }}
      NEON_STORAGE_BUCKET: statarena-data
      NEON_STORAGE_REGION: us-east-2
      NEON_STORAGE_ACCESS_KEY_ID: ${{ secrets.NEON_INGEST_STORAGE_ACCESS_KEY_ID }}
      NEON_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.NEON_INGEST_STORAGE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dashboard
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: dashboard/scripts/neon-requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: pip install -r dashboard/scripts/neon-requirements.txt
      - run: bun install --frozen-lockfile
        working-directory: dashboard
      - name: Sync current matches directly into Neon
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
          SYNC_MINUTES: ${{ inputs.minutes || '60' }}
          SYNC_REQUESTS: ${{ inputs.max_requests || '20000' }}
        run: python dashboard/scripts/neon_ingest.py --mode daily --minutes "$SYNC_MINUTES" --max-requests "$SYNC_REQUESTS"
      - name: Refresh supplemental records in Neon
        run: node dashboard/scripts/neon_refresh_sources.mjs
      - name: Refresh portraits for observed coaches
        run: node dashboard/scripts/neon_observed_coaches.mjs
      - name: Store new display images in Neon
        run: python dashboard/scripts/neon_assets.py --limit 3000
  coach_portraits:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_INGEST_DATABASE_URL }}
      NEON_STORAGE_ENDPOINT: ${{ secrets.NEON_STORAGE_ENDPOINT }}
      NEON_STORAGE_BUCKET: statarena-data
      NEON_STORAGE_REGION: us-east-2
      NEON_STORAGE_ACCESS_KEY_ID: ${{ secrets.NEON_INGEST_STORAGE_ACCESS_KEY_ID }}
      NEON_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.NEON_INGEST_STORAGE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dashboard
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: dashboard/scripts/neon-requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: pip install -r dashboard/scripts/neon-requirements.txt
      - run: bun install --frozen-lockfile
        working-directory: dashboard
      - name: Restore the Le Havre coach portrait
        run: node dashboard/scripts/neon_observed_coaches.mjs --name 'Didier Digard'
      - name: Store the first portraits
        run: python dashboard/scripts/neon_assets.py --limit 3000 --retry-commons
      - name: Discover other observed coach portraits
        run: node dashboard/scripts/neon_observed_coaches.mjs --all
      - name: Store all discovered portraits
        run: python dashboard/scripts/neon_assets.py --limit 3000 --retry-commons
