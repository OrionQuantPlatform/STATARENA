name: Published Villarreal PSG availability
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pitchapi-villarreal-psg-availability
  cancel-in-progress: false
jobs:
  observe:
    if: github.repository == 'OrionQuantPlatform/STATARENA' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 54249e365aff2f7c1eace8c157b8dd748cc67347
          sparse-checkout: |
            .github/actions/aws-database
            dashboard/backend/certs
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PostgreSQL driver
        run: pip install 'psycopg[binary]==3.3.7'
      - name: Load the existing read-only monitor identity
        uses: ./.github/actions/aws-database
        with:
          mode: runtime
          role-arn: arn:aws:iam::361769570630:role/StatArenaGitHubMonitor
      - name: Inspect the fixed season reader without modifying data
        shell: bash
        run: |
          python - <<'PYTHON'
          import json, os, time
          from pathlib import Path
          import psycopg
          SQL = "WITH candidates AS (\n (SELECT f.id,f.day FROM statarena_app.fixtures f WHERE f.season=%(p1)s AND f.league_id=%(p2)s  ORDER BY f.day NULLS LAST,f.id LIMIT (%(p3)s::int+1))\n UNION ALL (SELECT m.id,m.day FROM statarena_app.matches m WHERE m.season=%(p1)s AND m.league_id=%(p2)s \n AND NOT EXISTS(SELECT 1 FROM statarena_app.fixtures f WHERE f.id=m.id AND f.season=m.season AND f.league_id=m.league_id)\n ORDER BY m.day NULLS LAST,m.id LIMIT (%(p3)s::int+1))),\n keys AS (SELECT * FROM candidates ORDER BY day NULLS LAST,id LIMIT (%(p3)s::int+1)), page AS (SELECT id FROM keys ORDER BY day NULLS LAST,id LIMIT %(p3)s),\n page_appearances AS MATERIALIZED (\n SELECT a.*,p.name,p.image_url,s.value_text AS shirt_number_raw,s.value_type AS shirt_number_type\n FROM page k CROSS JOIN LATERAL (\n   SELECT * FROM statarena_app.appearances\n   WHERE match_id=k.id AND season=%(p1)s AND league_id=%(p2)s ORDER BY ordinal,id\n ) a JOIN statarena_app.players p ON p.id=a.player_ref\n LEFT JOIN statarena_app.appearance_shirt_numbers s ON s.appearance_id=a.id\n ),\n appearance_extras AS (\n SELECT e.appearance_id,json_object_agg(e.metric_key,e.value ORDER BY e.metric_key) extras\n FROM statarena_app.appearance_metrics e JOIN page_appearances a ON a.id=e.appearance_id GROUP BY e.appearance_id)\n SELECT s.*, (SELECT coalesce(json_agg(r),'[]'::json) FROM (SELECT id,day::text FROM keys ORDER BY day NULLS LAST,id) r) keys,\n (SELECT coalesce(json_agg(r),'[]'::json) FROM (SELECT m.* FROM statarena_app.matches m JOIN page USING(id) ORDER BY m.day NULLS LAST,m.id) r) matches,\n (SELECT coalesce(json_agg(r),'[]'::json) FROM (SELECT f.* FROM statarena_app.fixtures f JOIN page USING(id) ORDER BY f.day NULLS LAST,f.id) r) fixtures,\n (SELECT coalesce(json_agg(CASE WHEN (\n  SELECT array_agg(attname ORDER BY attnum) = ARRAY['id','player_ref','ordinal','position_id_type','player_id','team_id','team','match_id','league_id','league','country','season','date','role','position_id','raw_pitch_x','raw_pitch_y','shirt_number','minutes','rating','goals','assists','xg','npxg','xa','xgot','shots','shots_on_target','chances_created','big_chances_created','passes_accurate','defensive_actions','interceptions','tackles','recoveries','duels_won','duels_lost','touches','touches_box','passes_final_third','clearances','blocks','dribbles','saves','goals_prevented','shots_off_target','blocked_shots','shots_woodwork','shot_accuracy','big_chances_missed','xg_plus_xa','long_balls_accurate','line_breaking_passes','accurate_crosses','corners','throws','offsides','dispossessed','dribbled_past','headed_clearances','aerials_won','ground_duels_won','fouls','was_fouled','errors_led_to_goal','goals_conceded','saves_inside_box','dive_saves','sweeper_actions','high_claims','punches','xgot_faced','distance_covered','top_speed','sprints','running_distance','sprinting_distance','fantasy_points','passes_attempted','long_balls_attempted','crosses_attempted','ground_duels','aerial_duels','dribbles_attempted','starter','stats_reliable','is_captain']::name[]\n  FROM pg_catalog.pg_attribute\n  WHERE attrelid='statarena_app.appearances'::regclass AND attnum>0 AND NOT attisdropped\n) THEN json_build_array(r.id,r.player_ref,r.ordinal,r.position_id_type,r.player_id,r.team_id,r.team,r.match_id,r.league_id,r.league,r.country,r.season,r.date,r.role,r.position_id,r.raw_pitch_x,r.raw_pitch_y,r.shirt_number,r.minutes,r.rating,r.goals,r.assists,r.xg,r.npxg,r.xa,r.xgot,r.shots,r.shots_on_target,r.chances_created,r.big_chances_created,r.passes_accurate,r.defensive_actions,r.interceptions,r.tackles,r.recoveries,r.duels_won,r.duels_lost,r.touches,r.touches_box,r.passes_final_third,r.clearances,r.blocks,r.dribbles,r.saves,r.goals_prevented,r.shots_off_target,r.blocked_shots,r.shots_woodwork,r.shot_accuracy,r.big_chances_missed,r.xg_plus_xa,r.long_balls_accurate,r.line_breaking_passes,r.accurate_crosses,r.corners,r.throws,r.offsides,r.dispossessed,r.dribbled_past,r.headed_clearances,r.aerials_won,r.ground_duels_won,r.fouls,r.was_fouled,r.errors_led_to_goal,r.goals_conceded,r.saves_inside_box,r.dive_saves,r.sweeper_actions,r.high_claims,r.punches,r.xgot_faced,r.distance_covered,r.top_speed,r.sprints,r.running_distance,r.sprinting_distance,r.fantasy_points,r.passes_attempted,r.long_balls_attempted,r.crosses_attempted,r.ground_duels,r.aerial_duels,r.dribbles_attempted,r.starter,r.stats_reliable,r.is_captain,r.name,r.image_url,r.extras,r.shirt_number_raw,r.shirt_number_type)\n  ELSE row_to_json(r) END),'[]'::json) FROM (SELECT a.*,e.extras FROM page_appearances a LEFT JOIN appearance_extras e ON e.appearance_id=a.id ORDER BY a.match_id,a.ordinal,a.id) r) appearances,\n (SELECT coalesce(json_agg(r),'[]'::json) FROM (SELECT r.* FROM page p CROSS JOIN LATERAL (\n    SELECT * FROM statarena_app.shots WHERE match_id=p.id ORDER BY ordinal,id\n  ) r ORDER BY r.match_id,r.ordinal,r.id) r) shots,\n (SELECT coalesce(json_agg(r),'[]'::json) FROM (SELECT r.* FROM page p CROSS JOIN LATERAL (\n    SELECT * FROM statarena_app.team_statistics WHERE match_id=p.id ORDER BY ordinal\n  ) r ORDER BY r.match_id,r.ordinal) r) stats,\n (SELECT coalesce(json_agg(r),'[]'::json) FROM (SELECT r.* FROM page p CROSS JOIN LATERAL (\n    SELECT * FROM statarena_app.match_coverage WHERE match_id=p.id ORDER BY coverage_key\n  ) r ORDER BY r.match_id,r.coverage_key) r) cover,\n (SELECT coalesce(json_agg(r),'[]'::json) FROM (SELECT r.match_id,r.appearance_id FROM page p CROSS JOIN LATERAL (\n    SELECT * FROM statarena_app.match_appearance_members WHERE match_id=p.id ORDER BY ordinal\n  ) r ORDER BY r.match_id,r.ordinal) r) players,\n (SELECT coalesce(json_agg(r),'[]'::json) FROM (SELECT r.* FROM page p CROSS JOIN LATERAL (\n    SELECT * FROM statarena_app.match_warnings WHERE match_id=p.id ORDER BY ordinal\n  ) r ORDER BY r.match_id,r.ordinal) r) warnings,\n (SELECT coalesce(json_agg(r),'[]'::json) FROM (SELECT m.metric_key AS key,m.label,m.unit,m.decimals FROM statarena_app.partition_metrics pm JOIN statarena_app.metric_definitions m USING(metric_key) WHERE pm.season=%(p1)s AND pm.league_id=%(p2)s ORDER BY pm.ordinal) r) metrics,\n (SELECT coalesce(json_agg(r),'[]'::json) FROM (SELECT c.*,s.season,s.sample_matches,(SELECT json_agg(native_season ORDER BY ordinal) FROM statarena_app.competition_catalog_seasons k WHERE k.competition_id=c.id) catalog_seasons FROM statarena_app.competitions c JOIN statarena_app.competition_seasons s ON s.competition_id=c.id WHERE c.id=%(p2)s AND s.season=%(p1)s) r) competitions,\n (SELECT coalesce(json_agg(r),'[]'::json) FROM (SELECT s.team_id AS id,s.name,s.image_url,s.sample_matches,t.country FROM statarena_app.team_seasons s JOIN statarena_app.teams t ON s.team_id=t.id WHERE season=%(p1)s AND league_id=%(p2)s ORDER BY s.team_id) r) teams,\n (SELECT json_object_agg(metric_key,value) FROM statarena_app.partition_counts WHERE season=%(p1)s AND league_id=%(p2)s) counts,\n (SELECT json_agg(note ORDER BY ordinal) FROM statarena_app.partition_notes WHERE season=%(p1)s AND league_id=%(p2)s) notes FROM (SELECT p.*,source_digest AS version, EXISTS(SELECT 1 FROM statarena_app.publication_jobs j WHERE j.season=p.season AND j.league_id=p.league_id) dirty FROM statarena_app.partitions p WHERE season=%(p1)s AND league_id=%(p2)s) s"
          PARAMS = {"p1":"2026/2027","p2":"l_3Ci5Cg","p3":100}
          
          def nodes(plan, result=None):
              result=[] if result is None else result
              keep=('Node Type','Relation Name','Index Name','Join Type','Plan Rows','Actual Rows','Actual Loops','Actual Total Time','Total Cost','Rows Removed by Filter')
              result.append({k:plan[k] for k in keep if k in plan})
              for child in plan.get('Plans',[]): nodes(child,result)
              return result
          with psycopg.connect(os.environ['DATABASE_URL'],connect_timeout=10,autocommit=True,options='-c default_transaction_read_only=on -c statement_timeout=20000 -c lock_timeout=1000') as db:
              identity=db.execute("SELECT current_database(),current_user,current_setting('jit')").fetchone()
              if identity[:2] != ('statarena_prod','statarena_runtime'):raise ValueError('Unexpected read-only target')
              print(json.dumps({'phase':'reader-identity','database':identity[0],'user':identity[1],'jit':identity[2]}),flush=True)
              indexes=db.execute("SELECT tablename,indexname,indexdef FROM pg_indexes WHERE schemaname='statarena_app' AND tablename IN ('appearances','match_appearance_members') ORDER BY indexname").fetchall()
              print(json.dumps({'phase':'reader-indexes','indexes':indexes}),flush=True)
              for label,jit,analyze in [('estimated',None,False),('actual',None,True),('repeat',None,True)]:
                  started=time.monotonic()
                  try:
                      with db.transaction():
                          if jit:db.execute('SET LOCAL jit=off')
                          prefix='EXPLAIN (ANALYZE,BUFFERS,FORMAT JSON) ' if analyze else 'EXPLAIN (FORMAT JSON) '
                          plan=db.execute(prefix+SQL,PARAMS).fetchone()[0][0]
                      Path('read-plan-'+label+'.json').write_text(json.dumps(plan,indent=2))
                      print(json.dumps({'phase':'reader-plan','label':label,'seconds':round(time.monotonic()-started,3),'execution_ms':plan.get('Execution Time'),'planning_ms':plan.get('Planning Time'),'jit':plan.get('JIT'),'nodes':nodes(plan['Plan'])},separators=(',',':')),flush=True)
                  except psycopg.Error as error:
                      print(json.dumps({'phase':'reader-plan-error','label':label,'seconds':round(time.monotonic()-started,3),'sqlstate':error.sqlstate,'class':type(error).__name__}),flush=True)
          PYTHON
      - name: Save query plans
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aws-reader-plans-${{ github.run_id }}
          path: read-plan-*.json
          if-no-files-found: ignore
      - name: Disable the one-time monitor
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/pitchapi-villarreal-psg-availability.yml/disable"
