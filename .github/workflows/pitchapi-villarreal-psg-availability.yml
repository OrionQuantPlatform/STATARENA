# Preserve this name: the existing read-only AWS role trusts this workflow.
name: Published Villarreal PSG availability
on:
  workflow_dispatch:
    inputs:
      verify_stop:
        description: 'Test only: verify automatic shutdown without querying RDS'
        type: boolean
        default: false
      schema_inventory:
        description: 'Count current RDS tables in a read-only transaction (no publication)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pitchapi-villarreal-psg-availability
  cancel-in-progress: false
jobs:
  observe:
    if: github.repository == 'OrionQuantPlatform/STATARENA' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      actions: write
    runs-on: ${{ vars.STATARENA_AWS_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        if: inputs.verify_stop != true
        with:
          sparse-checkout: |
            .github/actions/aws-database
            dashboard/backend/certs
          filter: blob:none
      - uses: actions/setup-python@v5
        if: inputs.verify_stop != true
        with:
          python-version: '3.13'
      - name: Install PostgreSQL driver
        if: inputs.verify_stop != true
        run: pip install 'psycopg[binary]==3.3.7'
      - name: Load read-only RDS credentials
        if: inputs.verify_stop != true
        uses: ./.github/actions/aws-database
        with:
          mode: runtime
          role-arn: ${{ vars.STATARENA_AWS_MONITOR_ROLE_ARN }}
      - name: Count user tables without scanning business data
        if: inputs.verify_stop != true && inputs.schema_inventory == true
        run: python .github/actions/aws-database/inventory.py
      - name: Save schema inventory
        if: inputs.schema_inventory == true
        uses: actions/upload-artifact@v4
        with:
          name: schema-inventory-${{ github.run_id }}
          path: schema-inventory.json
          if-no-files-found: error
      - name: Observe relational publication
        id: probe
        if: inputs.verify_stop != true && inputs.schema_inventory != true
        run: python .github/actions/aws-database/monitor.py
      - name: Stop the schedule after publication
        if: inputs.verify_stop == true || steps.probe.outputs.complete == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/pitchapi-villarreal-psg-availability.yml/disable"
          echo 'Monitor disabled after published core data or the explicit shutdown test.'
