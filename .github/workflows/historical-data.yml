name: Historical worldwide catch-up

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: football-daily-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 1
      - name: Configure publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Collect missing history country by country
        id: collect
        run: python3 -u dashboard/scripts/collect_pitchapi_countries.py --minutes 280 --publish
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
      - name: Continue from the country checkpoint
        if: steps.collect.outputs.continue == 'true'
        run: gh workflow run historical-data.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save collection receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: historical-country-receipt
          path: data/raw/pitchapi-world/countries.json
          if-no-files-found: ignore
          retention-days: 14
