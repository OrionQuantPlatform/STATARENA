name: Build serving tables (AWS)
on:
  workflow_dispatch:
    inputs:
      schema_only:
        description: Install schemas without building business data
        type: boolean
        default: false
      queue_all:
        description: Requeue every published season (first run only)
        type: boolean
        default: false
      minutes:
        description: Maximum serving-table build minutes (1-100; job reserves 20 minutes for setup and commit)
        default: "100"
        required: true
      batch:
        description: Queue fetch size (each partition commits separately)
        default: "10"
        required: true
      lineup_reader:
        description: Optional lineup reader verification or reversible switch after installation
        type: choice
        options: [unchanged, verify, unified, legacy]
        default: unchanged
permissions:
  contents: read
concurrency:
  group: statarena-aws-ingestion
  cancel-in-progress: false
  queue: max
jobs:
  rematerialize:
    if: github.repository_id == '1441213700' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ vars.STATARENA_AWS_RUNNER || 'ubuntu-latest' }}
    env:
      STATARENA_SQL_LIMIT_BYTES: ${{ vars.STATARENA_SQL_LIMIT_BYTES }}
      STATARENA_SQL_RESERVE_BYTES: ${{ vars.STATARENA_SQL_RESERVE_BYTES }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            dashboard
            .github/actions/aws-database
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: dashboard/scripts/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: pip install -r dashboard/scripts/requirements.txt
      - name: Load AWS staging credentials
        uses: ./.github/actions/aws-database
        with:
          mode: ingest
          role-arn: ${{ vars.STATARENA_AWS_INGEST_ROLE_ARN }}
      - name: Publish relational models in AWS RDS
        env:
          QUEUE_ALL: ${{ inputs.queue_all }}
          MATERIALIZE_MINUTES: ${{ inputs.minutes }}
          MATERIALIZE_BATCH: ${{ inputs.batch }}
          SCHEMA_ONLY: ${{ inputs.schema_only }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$MATERIALIZE_MINUTES" =~ ^[1-9][0-9]{0,2}$ ]] || (( 10#$MATERIALIZE_MINUTES > 100 )); then
            echo 'Build minutes must be between 1 and 100 within this 120-minute job' >&2; exit 1
          fi
          if [[ ! "$MATERIALIZE_BATCH" =~ ^[1-9][0-9]{0,2}$ ]] || (( 10#$MATERIALIZE_BATCH > 100 )); then
            echo 'Queue batch must be between 1 and 100' >&2; exit 1
          fi
          args=(--minutes "$MATERIALIZE_MINUTES" --batch "$MATERIALIZE_BATCH")
          if [ "$QUEUE_ALL" = "true" ]; then args+=(--all); fi
          if [ "$SCHEMA_ONLY" = "true" ]; then args+=(--install-only); fi
          python dashboard/scripts/relational_materialize.py "${args[@]}" | tee rematerialize.log
      - name: Verify or switch the lineup read contract
        if: inputs.lineup_reader != '' && inputs.lineup_reader != 'unchanged'
        env:
          LINEUP_READER: ${{ inputs.lineup_reader }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          case "$LINEUP_READER" in
            verify) ;;
            unified) args+=(--activate) ;;
            legacy) args+=(--rollback) ;;
            *) echo 'Invalid lineup reader operation' >&2; exit 1 ;;
          esac
          python dashboard/scripts/lineup_consolidation.py "${args[@]}" | tee lineup-contract.log
      - name: Save publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rematerialize-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            rematerialize.log
            lineup-contract.log
          if-no-files-found: ignore
