name: Rematerialize Dashboard
on:
  workflow_dispatch:
    inputs:
      queue_all:
        description: Requeue every published season (first run only)
        type: boolean
        default: false
      minutes:
        description: Maximum publication minutes
        default: "100"
        required: true
      batch:
        description: Partitions per transaction
        default: "10"
        required: true
permissions:
  contents: read
concurrency:
  group: statarena-neon-ingestion
  cancel-in-progress: false
  queue: max
jobs:
  rematerialize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_INGEST_DATABASE_URL }}
      NEON_STORAGE_ENDPOINT: ${{ secrets.NEON_STORAGE_ENDPOINT }}
      NEON_STORAGE_BUCKET: ${{ vars.STATARENA_STORAGE_BUCKET || 'statarena-data' }}
      NEON_STORAGE_REGION: ${{ vars.STATARENA_STORAGE_REGION || 'us-east-2' }}
      NEON_STORAGE_ACCESS_KEY_ID: ${{ secrets.NEON_INGEST_STORAGE_ACCESS_KEY_ID }}
      NEON_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.NEON_INGEST_STORAGE_SECRET_ACCESS_KEY }}
      STATARENA_EXTERNAL_STORAGE: ${{ vars.STATARENA_EXTERNAL_STORAGE }}
      STATARENA_SQL_DOCUMENTS: ${{ vars.STATARENA_SQL_DOCUMENTS }}
      STATARENA_S3_PATH_STYLE: ${{ vars.STATARENA_S3_PATH_STYLE || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dashboard
          filter: blob:none
      - name: Trust the AWS RDS certificate
        if: vars.STATARENA_EXTERNAL_STORAGE == '1'
        run: echo "PGSSLROOTCERT=$GITHUB_WORKSPACE/dashboard/backend/certs/rds-us-east-2.pem" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: dashboard/scripts/neon-requirements.txt
      - run: pip install -r dashboard/scripts/neon-requirements.txt
      - name: Rebuild from saved Neon responses
        env:
          QUEUE_ALL: ${{ inputs.queue_all }}
          MATERIALIZE_MINUTES: ${{ inputs.minutes }}
          MATERIALIZE_BATCH: ${{ inputs.batch }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--minutes "$MATERIALIZE_MINUTES" --batch "$MATERIALIZE_BATCH")
          if [ "$QUEUE_ALL" = "true" ]; then args+=(--all); fi
          python dashboard/scripts/neon_materialize.py "${args[@]}" | tee rematerialize.log
      - name: Save publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rematerialize-${{ github.run_id }}-${{ github.run_attempt }}
          path: rematerialize.log
          if-no-files-found: ignore
