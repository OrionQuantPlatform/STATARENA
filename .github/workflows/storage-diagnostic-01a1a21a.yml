name: Verify file-backed reader
on:
  push:
    branches: [codex/storage-diagnostic-01a1a21a]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_INGEST_DATABASE_URL }}
      NEON_STORAGE_ENDPOINT: ${{ secrets.NEON_STORAGE_ENDPOINT }}
      NEON_STORAGE_BUCKET: statarena-data
      NEON_STORAGE_REGION: us-east-2
      NEON_STORAGE_ACCESS_KEY_ID: ${{ secrets.NEON_INGEST_STORAGE_ACCESS_KEY_ID }}
      NEON_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.NEON_INGEST_STORAGE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8f3f0316c346cce1189d7f5eae26b68df54ff865
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: pip install -r dashboard/scripts/neon-requirements.txt
      - run: bun install --frozen-lockfile
        working-directory: dashboard
      - run: node --test tests/file-storage.test.mjs
      - run: python tests/file_store_test.py
      - run: bun run build
        working-directory: dashboard
      - run: bun run verify
        working-directory: dashboard
      - name: Show failed verification
        if: failure()
        run: |
          if [ -f dashboard/outputs/neon-runtime/http-e2e.json ]; then cat dashboard/outputs/neon-runtime/http-e2e.json; fi
          if [ -f dashboard/outputs/neon-runtime/server.log ]; then cat dashboard/outputs/neon-runtime/server.log; fi
