name: Verify managed file delivery
on:
  push:
    branches: [codex/storage-diagnostic-01a1a21a]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: statarena_managed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d statarena_managed_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEON_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/statarena_managed_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8e2257357f4462b57d8e4aa0da7eae8315541bd4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: pip install -r dashboard/scripts/neon-requirements.txt
      - run: bun install --frozen-lockfile
        working-directory: dashboard
      - run: python tests/managed_storage_test.py
      - run: node tests/managed_http_integration.mjs
      - run: bun run build
        working-directory: dashboard
      - name: Verify existing Neon mode with real data
        run: bun run verify
        working-directory: dashboard
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_INGEST_DATABASE_URL }}
          NEON_STORAGE_ENDPOINT: ${{ secrets.NEON_STORAGE_ENDPOINT }}
          NEON_STORAGE_BUCKET: statarena-data
          NEON_STORAGE_REGION: us-east-2
          NEON_STORAGE_ACCESS_KEY_ID: ${{ secrets.NEON_INGEST_STORAGE_ACCESS_KEY_ID }}
          NEON_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.NEON_INGEST_STORAGE_SECRET_ACCESS_KEY }}
      - name: Show failed verification
        if: failure()
        run: |
          if [ -f dashboard/outputs/neon-runtime/http-e2e.json ]; then cat dashboard/outputs/neon-runtime/http-e2e.json; fi
          if [ -f dashboard/outputs/neon-runtime/server.log ]; then cat dashboard/outputs/neon-runtime/server.log; fi
