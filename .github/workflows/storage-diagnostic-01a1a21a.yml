name: Verify local file storage
on:
  push:
    branches: [codex/storage-diagnostic-01a1a21a]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: statarena_file_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d statarena_file_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEON_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/statarena_file_test?sslmode=disable
      STATARENA_DATABASE_SSLMODE: disable
      STATARENA_LOCAL_TEST: '1'
      FILE_STORAGE_ROOT: /tmp/statarena-file-integration
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 913d623f8f1f3344ceff913fb6940e6d95318b94
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: pip install -r dashboard/scripts/neon-requirements.txt
      - run: bun install --frozen-lockfile
        working-directory: dashboard
      - run: mkdir -p "$FILE_STORAGE_ROOT"
      - run: node --test tests/local-files.test.mjs
      - run: python tests/local_file_store_test.py
      - run: python tests/seed_local_ingest.py
      - run: python dashboard/scripts/verify_neon_ingestion.py --report /tmp/statarena-file-report.json
      - run: node tests/local_http_integration.mjs
      - run: bun run build
        working-directory: dashboard
      - name: Show failed integration report
        if: failure()
        run: |
          if [ -f /tmp/statarena-file-report.json ]; then cat /tmp/statarena-file-report.json; fi
