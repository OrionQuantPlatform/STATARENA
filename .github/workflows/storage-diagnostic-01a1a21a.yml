name: Verify stored file copies
on:
  push:
    branches: [codex/storage-diagnostic-01a1a21a]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_INGEST_DATABASE_URL }}
      NEON_STORAGE_ENDPOINT: ${{ secrets.NEON_STORAGE_ENDPOINT }}
      NEON_STORAGE_ACCESS_KEY_ID: ${{ secrets.NEON_INGEST_STORAGE_ACCESS_KEY_ID }}
      NEON_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.NEON_INGEST_STORAGE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install 'psycopg[binary]==3.3.7' 'boto3==1.43.123'
      - name: Compare all in-database copies with stored files
        run: |
          python - <<'PY'
          import concurrent.futures, hashlib, json, os
          import boto3, psycopg
          from botocore.config import Config
          with psycopg.connect(os.environ['NEON_DATABASE_URL'], options='-c default_transaction_read_only=on -c statement_timeout=120000') as db:
              rows = db.execute('SELECT path,size,sha256,body FROM statarena.objects WHERE body IS NOT NULL ORDER BY path').fetchall()
          s3 = boto3.client('s3', endpoint_url=os.environ['NEON_STORAGE_ENDPOINT'], region_name='us-east-2', aws_access_key_id=os.environ['NEON_STORAGE_ACCESS_KEY_ID'], aws_secret_access_key=os.environ['NEON_STORAGE_SECRET_ACCESS_KEY'], config=Config(signature_version='s3v4', s3={'addressing_style':'path'}, request_checksum_calculation='when_required', response_checksum_validation='when_required', retries={'max_attempts':4}, max_pool_connections=12))
          def check(row):
              path, size, digest, body = row
              expected = bytes(digest)
              try:
                  if len(body) != size or hashlib.sha256(body).digest() != expected:
                      return 'database_mismatch'
                  result = s3.get_object(Bucket='statarena-data', Key='data/' + path)
                  stream = result['Body']
                  hasher = hashlib.sha256()
                  n = 0
                  while True:
                      chunk = stream.read(1024*1024)
                      if not chunk: break
                      hasher.update(chunk)
                      n += len(chunk)
                  stream.close()
                  if n != size or hasher.digest() != expected: return 'file_mismatch'
                  return 'matched'
              except Exception as e:
                  return type(e).__name__
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              outcomes = list(pool.map(check, rows))
          counts = {key: outcomes.count(key) for key in sorted(set(outcomes))}
          print(json.dumps({'objects': len(rows), 'bytes': sum(r[1] for r in rows), 'outcomes': counts}, sort_keys=True))
          if counts.get('matched', 0) != len(rows): raise SystemExit('File copy verification incomplete')
          PY
