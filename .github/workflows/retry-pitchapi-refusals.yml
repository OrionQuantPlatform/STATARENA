name: Retry refused PitchAPI profiles

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pitchapi-refusal-retries
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            dashboard/scripts
            data/raw/pitchapi-world/checkpoints
            data/raw/pitchapi-world/refusal-retries
      - name: Configure publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Retry the ten refused profiles and preserve responses
        run: python3 -u dashboard/scripts/retry_pitchapi_refusals.py --limit 10 --publish
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
      - name: Save retry receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pitchapi-refusal-retries
          path: data/raw/pitchapi-world/refusal-retries/*.json.gz
          if-no-files-found: warn
          retention-days: 14
