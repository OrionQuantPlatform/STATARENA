name: Verify ingestion
on:
  push:
    paths:
      - '.github/workflows/verify-ingestion.yml'
      - '.github/workflows/daily-sync.yml'
      - '.github/workflows/historical-backfill.yml'
      - 'dashboard/scripts/neon_*.py'
      - 'tests/daily_refresh_postgres.py'
      - 'tests/test_daily_refresh.py'
  pull_request:
    paths:
      - '.github/workflows/verify-ingestion.yml'
      - '.github/workflows/daily-sync.yml'
      - '.github/workflows/historical-backfill.yml'
      - 'dashboard/scripts/neon_*.py'
      - 'tests/daily_refresh_postgres.py'
      - 'tests/test_daily_refresh.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: statarena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/statarena_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: dashboard/scripts/neon-requirements.txt
      - run: pip install -r dashboard/scripts/neon-requirements.txt
      - run: python -m unittest discover -s tests -p 'test_daily_refresh.py' -v
      - run: python tests/daily_refresh_postgres.py
