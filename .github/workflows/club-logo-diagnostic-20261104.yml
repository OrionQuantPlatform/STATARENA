name: Diagnose club crests
on:
  push:
    branches: [codex/club-logo-diagnostic-20261104]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_INGEST_DATABASE_URL }}
      NEON_STORAGE_ENDPOINT: ${{ secrets.NEON_STORAGE_ENDPOINT }}
      NEON_STORAGE_ACCESS_KEY_ID: ${{ secrets.NEON_INGEST_STORAGE_ACCESS_KEY_ID }}
      NEON_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.NEON_INGEST_STORAGE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install 'psycopg[binary]==3.3.7' 'boto3==1.43.123'
      - name: Inspect availability and catalog
        run: |
          python - <<'PY'
          import json, os, re, boto3, psycopg
          from botocore.config import Config
          from psycopg.rows import dict_row
          report = {}
          try:
              with psycopg.connect(os.environ['NEON_DATABASE_URL'], connect_timeout=15, options='-c default_transaction_read_only=on -c statement_timeout=120000', row_factory=dict_row) as db:
                  report['database'] = db.execute("select current_timestamp as at, pg_database_size(current_database()) as bytes").fetchone()
                  sql = '''WITH teams AS (
                    SELECT DISTINCT ON (t->>'id') t->>'id' AS id, t->>'name' AS name, t->>'image_url' AS url
                    FROM statarena.fixtures f CROSS JOIN LATERAL (VALUES (f.body->'home_team'),(f.body->'away_team')) AS x(t)
                    WHERE t->>'id' IS NOT NULL AND t->>'name' ~* '(caen|west ham|anderlecht|fenerbah|wolverhampton|bristol city|leipzig|viking|slavia|sabah|cardiff|psv)'
                    ORDER BY t->>'id', CASE WHEN coalesce(t->>'image_url','')<>'' THEN 0 ELSE 1 END, f.updated_at DESC
                  ) SELECT t.id,t.name,t.url,(a.url IS NOT NULL) AS stored, j.error,j.attempts,j.next_attempt FROM teams t
                    LEFT JOIN statarena.assets a ON a.url=t.url LEFT JOIN statarena.asset_jobs j ON j.url=t.url ORDER BY t.name'''
                  report['clubs'] = db.execute(sql).fetchall()
                  report['jobs'] = db.execute("select count(*) as pending,count(*) filter(where next_attempt<=now()) as due,count(*) filter(where error like 'HTTPError:%') as http_errors from statarena.asset_jobs").fetchone()
          except Exception as e:
              report['database_error'] = {'type': type(e).__name__, 'message': re.sub(r'postgres(?:ql)?://\\S+', '[redacted]', str(e))[:700]}
          try:
              s3=boto3.client('s3',endpoint_url=os.environ['NEON_STORAGE_ENDPOINT'],region_name='us-east-2',aws_access_key_id=os.environ['NEON_STORAGE_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['NEON_STORAGE_SECRET_ACCESS_KEY'],config=Config(signature_version='s3v4',s3={'addressing_style':'path'},retries={'max_attempts':2},connect_timeout=10,read_timeout=15))
              r=s3.head_bucket(Bucket='statarena-data')
              report['storage']={'http_status':r['ResponseMetadata']['HTTPStatusCode']}
          except Exception as e:
              report['storage_error']={'type':type(e).__name__,'message':re.sub(r'postgres(?:ql)?://\\S+', '[redacted]',str(e))[:500]}
          print(json.dumps(report,default=str,ensure_ascii=False))
          PY
