name: Saudi Pro League backfill
on:
  push:
    branches: ["codex/saudi-pro-20261103"]
permissions:
  contents: read
concurrency:
  group: statarena-neon-ingestion
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_INGEST_DATABASE_URL }}
      NEON_STORAGE_ENDPOINT: ${{ secrets.NEON_STORAGE_ENDPOINT }}
      NEON_STORAGE_BUCKET: statarena-data
      NEON_STORAGE_REGION: us-east-2
      NEON_STORAGE_ACCESS_KEY_ID: ${{ secrets.NEON_INGEST_STORAGE_ACCESS_KEY_ID }}
      NEON_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.NEON_INGEST_STORAGE_SECRET_ACCESS_KEY }}
      PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dashboard
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: dashboard/scripts/neon-requirements.txt
      - run: pip install -r dashboard/scripts/neon-requirements.txt
      - name: Publish the first Saudi results
        run: python dashboard/scripts/neon_ingest.py --mode historical --priority-league l_0Lpz1f --minutes 4 --max-requests 3000
      - name: Store new images
        run: python dashboard/scripts/neon_assets.py --limit 1000
      - name: Continue collecting Saudi matches
        run: python dashboard/scripts/neon_ingest.py --mode historical --priority-league l_0Lpz1f --minutes 20 --max-requests 15000
      - name: Store remaining new images
        run: python dashboard/scripts/neon_assets.py --limit 3000
