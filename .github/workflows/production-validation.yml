name: Validate production (AWS)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-validation.yml'
      - 'dashboard/scripts/verify_aws_runtime.mjs'
  schedule:
    - cron: '35 7 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Collect football (AWS)', 'Collect standings (AWS)', 'Build serving tables (AWS)']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: statarena-production-validation
  cancel-in-progress: false
jobs:
  validate_site:
    if: github.repository_id == '1441213700' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      STATARENA_TEST_ORIGIN: https://vegasport.vercel.app
      STATARENA_TEST_EVIDENCE: production-validation.json
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dashboard/scripts
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate public AWS reads
        run: node dashboard/scripts/verify_aws_runtime.mjs
      - name: Validate public page shells
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          for (const path of ['/', '/matchs', '/competitions', '/clubs', '/joueurs']) {
            const r = await fetch('https://vegasport.vercel.app' + path, {signal: AbortSignal.timeout(30000)});
            assert.equal(r.status, 200, path);
            assert.match(r.headers.get('content-type') || '', /text\/html/);
            console.log(path + ': HTTP 200 HTML');
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-validation-${{ github.run_id }}
          path: production-validation.json
          if-no-files-found: warn
          retention-days: 14
