name: Historical Backfill
on:
  schedule:
    - cron: '15 0,12 * * *'
    - cron: '50 6 * * *'
    - cron: '15 18 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: Maximum collection minutes
        default: '280'
        required: true
      max_requests:
        description: Maximum provider requests
        default: '100000'
        required: true
      priority_league:
        description: Optional provider league ID to collect first
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: statarena-aws-ingestion
  cancel-in-progress: false
  queue: max
jobs:
  backfill:
    if: github.repository == 'OrionQuantPlatform/STATARENA' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/aws-backend-20261104')
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ vars.STATARENA_AWS_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 330
    env:
      STATARENA_OBJECT_LIMIT_BYTES: ${{ vars.STATARENA_OBJECT_LIMIT_BYTES }}
      STATARENA_SQL_LIMIT_BYTES: ${{ vars.STATARENA_SQL_LIMIT_BYTES }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            dashboard
            .github/actions/aws-database
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: dashboard/scripts/neon-requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: pip install -r dashboard/scripts/neon-requirements.txt
      - run: bun install --frozen-lockfile
        working-directory: dashboard
      - name: Load AWS staging credentials
        uses: ./.github/actions/aws-database
        with:
          mode: ingest
          role-arn: ${{ vars.STATARENA_AWS_INGEST_ROLE_ARN }}
      - name: Complete missing resources without Git data commits
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
          SYNC_MINUTES: ${{ github.event_name == 'schedule' && github.event.schedule == '15 18 * * *' && '210' || inputs.minutes || '280' }}
          SYNC_REQUESTS: ${{ inputs.max_requests || '100000' }}
          PRIORITY_LEAGUE: ${{ inputs.priority_league || '' }}
        run: |
          args=()
          if [ -n "$PRIORITY_LEAGUE" ]; then args+=(--priority-league "$PRIORITY_LEAGUE"); fi
          python dashboard/scripts/neon_ingest.py --skip-materialize --mode historical --minutes "$SYNC_MINUTES" --max-requests "$SYNC_REQUESTS" "${args[@]}"
      - name: Store newly discovered images in AWS staging
        run: python dashboard/scripts/neon_assets.py --limit 3000
      - name: Publish normalized RDS tables from staged data
        run: python dashboard/scripts/relational_materialize.py --minutes 15 --batch 10
