name: Historical Backfill
on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: Maximum collection minutes
        default: '280'
        required: true
      max_requests:
        description: Maximum provider requests
        default: '100000'
        required: true
permissions:
  contents: read
concurrency:
  group: statarena-neon-ingestion
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_INGEST_DATABASE_URL }}
      NEON_STORAGE_ENDPOINT: ${{ secrets.NEON_STORAGE_ENDPOINT }}
      NEON_STORAGE_BUCKET: ${{ vars.STATARENA_STORAGE_BUCKET || 'statarena-data' }}
      NEON_STORAGE_REGION: ${{ vars.STATARENA_STORAGE_REGION || 'us-east-2' }}
      NEON_STORAGE_ACCESS_KEY_ID: ${{ secrets.NEON_INGEST_STORAGE_ACCESS_KEY_ID }}
      NEON_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.NEON_INGEST_STORAGE_SECRET_ACCESS_KEY }}
      STATARENA_EXTERNAL_STORAGE: ${{ vars.STATARENA_EXTERNAL_STORAGE }}
      STATARENA_S3_PATH_STYLE: ${{ vars.STATARENA_S3_PATH_STYLE || '1' }}
      STATARENA_OBJECT_LIMIT_BYTES: ${{ vars.STATARENA_OBJECT_LIMIT_BYTES }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dashboard
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: dashboard/scripts/neon-requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: pip install -r dashboard/scripts/neon-requirements.txt
      - run: bun install --frozen-lockfile
        working-directory: dashboard
      - name: Complete missing resources without Git data commits
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
          SYNC_MINUTES: ${{ inputs.minutes || '280' }}
          SYNC_REQUESTS: ${{ inputs.max_requests || '100000' }}
        run: python dashboard/scripts/neon_ingest.py --mode historical --minutes "$SYNC_MINUTES" --max-requests "$SYNC_REQUESTS"
      - name: Store newly discovered images in Neon
        run: python dashboard/scripts/neon_assets.py --limit 3000
